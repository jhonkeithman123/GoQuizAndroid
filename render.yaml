services:
  - type: web
    name: goquiz-multiplayer-gateway
    env: node
    rootDir: server
    buildCommand: bun install
    startCommand: bun run start
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ENABLE_TCP
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
